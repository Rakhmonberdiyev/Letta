
services:

  # ── Letta OS ─────────────────────────────────────────────────────────────
  # Core Memory (blocks) + Archival Memory (passages).
  # Recall Memory is handled locally via memory/sessions_data.json — no Redis needed.
  letta:
    image: letta/letta:latest
    container_name: letta_server
    ports:
      - "8283:8283"
    environment:
      - LETTA_SERVER_PASS=${LETTA_SERVER_PASS:-}
      - OPENAI_API_KEY=${LLM_API_KEY:-sk-raximberdi-cmF4aW1iZXJkaQ}
    volumes:
      - letta_data:/root/.letta
    restart: unless-stopped

  # ── Qdrant ───────────────────────────────────────────────────────────────
  # Used ONLY for the RAG knowledge_base (uploaded PDFs / documents).
  # Host port 6334 avoids clashing with the MCP/Mem0 project's Qdrant on 6333.
  qdrant:
    image: qdrant/qdrant
    container_name: qdrant_rag
    ports:
      - "6334:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  letta_data:
  qdrant_data:
